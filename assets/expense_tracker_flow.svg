<text x="515" y="578" font-size="12" fill="#57657a" font-weight="600" text-anchor="start">Yes</text>
<path d="M 615 629 L 709 629" fill="none" stroke="#64748b" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="651" y="617" font-size="12" fill="#57657a" font-weight="600" text-anchor="start">2 / 3</text>
