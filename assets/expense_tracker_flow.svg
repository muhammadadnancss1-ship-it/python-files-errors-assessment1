<path d="M 62 1343 L 32 1343 L 32 879" fill="none" stroke="#64748b" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M 500 1393 L 500 1434" fill="none" stroke="#64748b" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="515" y="1418" font-size="12" fill="#57657a" font-weight="600" text-anchor="start">Yes</text>
<path d="M 650 1467 L 980 1467 L 980 629" fill="none" stroke="#64748b" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="28" y="1546" font-size="13" fill="#57657a" font-weight="400" text-anchor="start">EOF / Ctrl+C during input → print Program closed. → End</text>
