<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1580" viewBox="0 0 1000 1580" role="img" aria-labelledby="title desc">
<title id='title'>Expense tracker program flow</title><desc id='desc'>Start, load CSV validation, repeated menu, record display, category totals, expense input validation, amount retry loop and protected saving.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse" markerUnits="strokeWidth"><path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/></marker>
<linearGradient id="hero" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#102b57"/><stop offset="1" stop-color="#35205c"/></linearGradient></defs>
<rect width="1000" height="1580" fill="#ffffff"/>
<g font-family="Arial, Helvetica, sans-serif">
<text x="28" y="31" font-size="11" fill="#2563eb" font-weight="700" text-anchor="start">TASK 01 / PROGRAM FLOW</text>
<text x="28" y="64" font-size="27" fill="#17233b" font-weight="700" text-anchor="start">Expense tracker</text>
<text x="28" y="87" font-size="14" fill="#57657a" font-weight="400" text-anchor="start">The menu repeats; a new expense enters memory only after a successful save.</text>
<rect x="410.0" y="107.0" width="180" height="42" rx="21.0" fill="#f0fdf4" stroke="#15803d"/>
<text x="500" y="133" font-size="15" fill="#17233b" font-weight="500" text-anchor="middle">Start</text>
<rect x="350.0" y="176.0" width="300" height="60" rx="10" fill="#eff6ff" stroke="#2563eb"/>
<text x="500" y="201" font-size="15" fill="#17233b" font-weight="500" text-anchor="middle">Load existing CSV</text>
<text x="500" y="221" font-size="15" fill="#17233b" font-weight="500" text-anchor="middle">or start empty if missing</text>
<path d="M 500 254.0 L 615.0 304 L 500 354.0 L 385.0 304 Z" fill="#f5f3ff" stroke="#7c3aed"/>
<text x="500" y="309" font-size="15" fill="#17233b" font-weight="500" text-anchor="middle">Load succeeded?</text>
<rect x="60.0" y="272.0" width="232" height="64" rx="10" fill="#fef2f2" stroke="#dc2626"/>
<text x="176" y="299" font-size="15" fill="#17233b" font-weight="500" text-anchor="middle">Report load error</text>
<text x="176" y="319" font-size="15" fill="#17233b" font-weight="500" text-anchor="middle">Keep existing data</text>
<rect x="101.0" y="359.0" width="150" height="42" rx="21.0" fill="#f0fdf4" stroke="#15803d"/>
<text x="176" y="385" font-size="15" fill="#17233b" font-weight="500" text-anchor="middle">End</text>
<rect x="350.0" y="380.0" width="300" height="60" rx="10" fill="#eff6ff" stroke="#2563eb"/>
<text x="500" y="405" font-size="15" fill="#17233b" font-weight="500" text-anchor="middle">Show menu</text>
<text x="500" y="425" font-size="15" fill="#17233b" font-weight="500" text-anchor="middle">Read option 1–4</text>
<path d="M 500 467.0 L 615.0 517 L 500 567.0 L 385.0 517 Z" fill="#f5f3ff" stroke="#7c3aed"/>
<text x="500" y="522" font-size="15" fill="#17233b" font-weight="500" text-anchor="middle">Option valid?</text>
<rect x="62.0" y="488.0" width="228" height="58" rx="10" fill="#fef2f2" stroke="#dc2626"/>
<text x="176" y="512" font-size="15" fill="#17233b" font-weight="500" text-anchor="middle">Invalid option</text>
<text x="176" y="532" font-size="15" fill="#17233b" font-weight="500" text-anchor="middle">Ask again</text>
<path d="M 500 579.0 L 615.0 629 L 500 679.0 L 385.0 629 Z" fill="#f5f3ff" stroke="#7c3aed"/>
<text x="500" y="634" font-size="15" fill="#17233b" font-weight="500" text-anchor="middle">Which option?</text>
<rect x="709.0" y="587.0" width="256" height="84" rx="10" fill="#f0fdf4" stroke="#15803d"/>
<text x="837" y="614" font-size="14" fill="#17233b" font-weight="500" text-anchor="middle">2: display saved records</text>
<text x="837" y="634" font-size="14" fill="#17233b" font-weight="500" text-anchor="middle">3: display category totals</text>
<text x="837" y="654" font-size="14" fill="#17233b" font-weight="500" text-anchor="middle">(empty list: show message)</text>
<rect x="62.0" y="602.0" width="228" height="54" rx="10" fill="#f0fdf4" stroke="#15803d"/>
<text x="176" y="634" font-size="15" fill="#17233b" font-weight="500" text-anchor="middle">4: print Goodbye!</text>
<rect x="101.0" y="692.0" width="150" height="42" rx="21.0" fill="#f0fdf4" stroke="#15803d"/>
<text x="176" y="718" font-size="15" fill="#17233b" font-weight="500" text-anchor="middle">End</text>
<rect x="350.0" y="742.0" width="300" height="62" rx="10" fill="#eff6ff" stroke="#2563eb"/>
<text x="500" y="768" font-size="15" fill="#17233b" font-weight="500" text-anchor="middle">1: read five text fields</text>
<text x="500" y="788" font-size="15" fill="#17233b" font-weight="500" text-anchor="middle">Trim and normalize text</text>
<path d="M 500 829.0 L 615.0 879 L 500 929.0 L 385.0 879 Z" fill="#f5f3ff" stroke="#7c3aed"/>
<text x="500" y="884" font-size="15" fill="#17233b" font-weight="500" text-anchor="middle">All fields nonblank?</text>
<rect x="62.0" y="849.0" width="228" height="60" rx="10" fill="#fffbeb" stroke="#b45309"/>
<text x="176" y="874" font-size="15" fill="#17233b" font-weight="500" text-anchor="middle">Required-field warning</text>
<text x="176" y="894" font-size="15" fill="#17233b" font-weight="500" text-anchor="middle">Return to menu</text>
<rect x="350.0" y="967.0" width="300" height="58" rx="10" fill="#eff6ff" stroke="#2563eb"/>
<text x="500" y="1001" font-size="15" fill="#17233b" font-weight="500" text-anchor="middle">Read amount; convert to float</text>
<path d="M 500 1050.0 L 615.0 1100 L 500 1150.0 L 385.0 1100 Z" fill="#f5f3ff" stroke="#7c3aed"/>
<text x="500" y="1095" font-size="15" fill="#17233b" font-weight="500" text-anchor="middle">Numeric, finite</text>
<text x="500" y="1115" font-size="15" fill="#17233b" font-weight="500" text-anchor="middle">and ≥ 0?</text>
<rect x="712.0" y="1069.0" width="250" height="62" rx="10" fill="#fef2f2" stroke="#dc2626"/>
<text x="837" y="1095" font-size="15" fill="#17233b" font-weight="500" text-anchor="middle">Report amount error</text>
<text x="837" y="1115" font-size="15" fill="#17233b" font-weight="500" text-anchor="middle">Retry amount input</text>
<rect x="350.0" y="1186.0" width="300" height="70" rx="10" fill="#eff6ff" stroke="#2563eb"/>
<text x="500" y="1216" font-size="15" fill="#17233b" font-weight="500" text-anchor="middle">Build proposed expense list</text>
<text x="500" y="1236" font-size="15" fill="#17233b" font-weight="500" text-anchor="middle">Write .tmp; replace CSV</text>
<path d="M 500 1293.0 L 615.0 1343 L 500 1393.0 L 385.0 1343 Z" fill="#f5f3ff" stroke="#7c3aed"/>
<text x="500" y="1348" font-size="15" fill="#17233b" font-weight="500" text-anchor="middle">Save succeeded?</text>
<rect x="62.0" y="1305.0" width="228" height="76" rx="10" fill="#fef2f2" stroke="#dc2626"/>
<text x="176" y="1328" font-size="14" fill="#17233b" font-weight="500" text-anchor="middle">Report save error</text>
<text x="176" y="1348" font-size="14" fill="#17233b" font-weight="500" text-anchor="middle">Keep old CSV and list</text>
<text x="176" y="1368" font-size="14" fill="#17233b" font-weight="500" text-anchor="middle">Return to menu</text>
<rect x="350.0" y="1434.0" width="300" height="66" rx="10" fill="#f0fdf4" stroke="#15803d"/>
<text x="500" y="1462" font-size="15" fill="#17233b" font-weight="500" text-anchor="middle">Append expense to memory</text>
<text x="500" y="1482" font-size="15" fill="#17233b" font-weight="500" text-anchor="middle">Print success</text>
