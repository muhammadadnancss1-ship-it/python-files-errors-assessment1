<path d="M 385 879 L 290 879" fill="none" stroke="#64748b" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="325" y="868" font-size="12" fill="#57657a" font-weight="600" text-anchor="start">No</text>
<path d="M 62 879 L 32 879 L 32 517" fill="none" stroke="#64748b" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M 500 929 L 500 967" fill="none" stroke="#64748b" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="515" y="951" font-size="12" fill="#57657a" font-weight="600" text-anchor="start">Yes</text>
<path d="M 500 1025 L 500 1050" fill="none" stroke="#64748b" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M 615 1100 L 712 1100" fill="none" stroke="#64748b" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
