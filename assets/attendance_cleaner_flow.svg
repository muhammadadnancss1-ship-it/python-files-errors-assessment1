<text x="28" y="64" font-size="27" fill="#17233b" font-weight="700" text-anchor="start">Attendance cleaner</text>
<text x="28" y="87" font-size="14" fill="#57657a" font-weight="400" text-anchor="start">Original count includes blank lines; the unique count includes only cleaned names.</text>
