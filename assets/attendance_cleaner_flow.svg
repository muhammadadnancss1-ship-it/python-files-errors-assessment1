<text x="500" y="445" font-size="15" fill="#17233b" font-weight="500" text-anchor="middle">strip() + title(); skip blanks</text>
<rect x="335.0" y="499.0" width="330" height="62" rx="10" fill="#eff6ff" stroke="#2563eb"/>
<text x="500" y="525" font-size="15" fill="#17233b" font-weight="500" text-anchor="middle">set(): remove duplicate names</text>
<text x="500" y="545" font-size="15" fill="#17233b" font-weight="500" text-anchor="middle">sorted(): alphabetical list</text>
