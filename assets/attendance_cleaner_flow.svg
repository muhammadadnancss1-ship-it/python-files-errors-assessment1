<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1210" viewBox="0 0 1000 1210" role="img" aria-labelledby="title desc">
<title id='title'>Attendance cleaner program flow</title><desc id='desc'>Read names, handle read errors, clean with a list comprehension, deduplicate, sort, save safely, print counts and loop through names.</desc>
