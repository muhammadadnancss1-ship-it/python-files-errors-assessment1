<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="604" viewBox="0 0 1000 604" role="img" aria-labelledby="title desc">
<title id='title'>Assessment overview</title><desc id='desc'>One card for each task with its file, topic, input, rules, outputs and Python concepts.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse" markerUnits="strokeWidth"><path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/></marker>
<linearGradient id="hero" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#102b57"/><stop offset="1" stop-color="#35205c"/></linearGradient></defs>
<rect width="1000" height="604" fill="#ffffff"/>
<g font-family="Arial, Helvetica, sans-serif">
<text x="28" y="31" font-size="11" fill="#2563eb" font-weight="700" text-anchor="start">PROJECT OVERVIEW</text>
<text x="28" y="64" font-size="27" fill="#17233b" font-weight="700" text-anchor="start">Two tools. One reliable file workflow.</text>
<text x="28" y="87" font-size="14" fill="#57657a" font-weight="400" text-anchor="start">Independent programs using only Python&#x27;s standard library.</text>
<rect x="24" y="112" width="462" height="447" rx="14" fill="#ffffff" stroke="#dce3ed"/>
<text x="46" y="148" font-size="16" fill="#2563eb" font-weight="700" text-anchor="start">01</text>
<text x="86" y="148" font-size="20" fill="#17233b" font-weight="700" text-anchor="start">Institute Expense Tracker</text>
<text x="46" y="181" font-size="22" fill="#17233b" font-weight="700" text-anchor="start">expense_tracker.py</text>
<text x="46" y="208" font-size="14" fill="#57657a" font-weight="400" text-anchor="start">File persistence + error handling</text>
<text x="46" y="243" font-size="11" fill="#2563eb" font-weight="700" text-anchor="start">INPUT</text>
<text x="46" y="268" font-size="14" fill="#17233b" font-weight="400" text-anchor="start">Menu entries + optional existing CSV</text>
<text x="46" y="289" font-size="14" fill="#17233b" font-weight="400" text-anchor="start">Date, item, category, time, day, amount</text>
<text x="46" y="319" font-size="11" fill="#7c3aed" font-weight="700" text-anchor="start">RULES</text>
<text x="46" y="344" font-size="14" fill="#17233b" font-weight="400" text-anchor="start">Required text; finite amount ≥ 0</text>
<text x="46" y="365" font-size="14" fill="#17233b" font-weight="400" text-anchor="start">Validate CSV rows; save before appending</text>
<text x="46" y="395" font-size="11" fill="#15803d" font-weight="700" text-anchor="start">OUTPUT</text>
<text x="46" y="420" font-size="14" fill="#17233b" font-weight="400" text-anchor="start">myExpenses1.csv</text>
<text x="46" y="441" font-size="14" fill="#17233b" font-weight="400" text-anchor="start">Expense list + totals by category</text>
<text x="46" y="471" font-size="11" fill="#17233b" font-weight="700" text-anchor="start">CONCEPTS</text>
<text x="46" y="496" font-size="14" fill="#17233b" font-weight="400" text-anchor="start">Functions • loops • dictionaries • CSV</text>
<text x="46" y="517" font-size="14" fill="#17233b" font-weight="400" text-anchor="start">Set comprehension • exceptions</text>
<rect x="514" y="112" width="462" height="447" rx="14" fill="#ffffff" stroke="#dce3ed"/>
<text x="536" y="148" font-size="16" fill="#2563eb" font-weight="700" text-anchor="start">02</text>
<text x="576" y="148" font-size="20" fill="#17233b" font-weight="700" text-anchor="start">Student Attendance Cleaner</text>
<text x="536" y="181" font-size="22" fill="#17233b" font-weight="700" text-anchor="start">attendance_cleaner.py</text>
<text x="536" y="208" font-size="14" fill="#57657a" font-weight="400" text-anchor="start">Text cleaning + sets + comprehensions</text>
<text x="536" y="243" font-size="11" fill="#2563eb" font-weight="700" text-anchor="start">INPUT</text>
<text x="536" y="268" font-size="14" fill="#17233b" font-weight="400" text-anchor="start">attendance.txt</text>
<text x="536" y="289" font-size="14" fill="#17233b" font-weight="400" text-anchor="start">One student name per original line</text>
<text x="536" y="319" font-size="11" fill="#7c3aed" font-weight="700" text-anchor="start">RULES</text>
<text x="536" y="344" font-size="14" fill="#17233b" font-weight="400" text-anchor="start">Trim + title-case; ignore blank names</text>
<text x="536" y="365" font-size="14" fill="#17233b" font-weight="400" text-anchor="start">Deduplicate with set(); sort with sorted()</text>
<text x="536" y="395" font-size="11" fill="#15803d" font-weight="700" text-anchor="start">OUTPUT</text>
<text x="536" y="420" font-size="14" fill="#17233b" font-weight="400" text-anchor="start">attendance_clean.csv</text>
<text x="536" y="441" font-size="14" fill="#17233b" font-weight="400" text-anchor="start">Original and unique record counts</text>
<text x="536" y="471" font-size="11" fill="#17233b" font-weight="700" text-anchor="start">CONCEPTS</text>
<text x="536" y="496" font-size="14" fill="#17233b" font-weight="400" text-anchor="start">Lists • sets • list comprehension • CSV</text>
<text x="536" y="517" font-size="14" fill="#17233b" font-weight="400" text-anchor="start">Functions • loops • exceptions</text>
<text x="28" y="588" font-size="12" fill="#57657a" font-weight="400" text-anchor="start">BLUE  input       PURPLE  decision       GREEN  success       RED  error       AMBER  warning</text>
</g>
</svg>
